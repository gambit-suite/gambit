[package]
name = "jaccard-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jaccard"
path = "src/main.rs"

[dependencies]
num_cpus = "1.16"
rayon = "1.8"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
byteorder = "1.5"
anyhow = "1.0"
hdf5 = "0.8"
ndarray = "0.15"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
